<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" id="favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collection</title>
    <script>
      // 立即尝试从缓存恢复标题和图标，避免默认标题闪烁
      try {
        const cached = localStorage.getItem('tat_site_settings');
        if (cached) {
          const settings = JSON.parse(cached);
          if (settings.title) document.title = settings.title;
          if (settings.iconUrl) {
            const link = document.getElementById('favicon');
            if (link) link.href = settings.iconUrl;
          }
        }
        // 立即恢复主题设置，防止闪烁
        const theme = localStorage.getItem('tat_theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && systemDark) || (theme === 'system' && systemDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { console.error('Failed to restore settings from cache', e); }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              ink: '#1a1a1a',
              paper: '#f5f5f4', // stone-100
              subtle: '#78716c', // stone-500
              border: '#e7e5e4', // stone-200
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #fcfcfc;
        color: #1a1a1a;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      html.dark body {
        background-color: #0c0c0c;
        color: #e5e5e5;
      }
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e7e5e4;
        border-radius: 3px;
      }
      html.dark ::-webkit-scrollbar-thumb {
        background: #3f3f46;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a8a29e;
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background: #71717a;
      }
    </style>

  }
}
</script>
